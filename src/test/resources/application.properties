# Test Database Configuration (H2 In-Memory Mode to isolate tests from persistent file DB)
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

# Application properties for tests
app.seed=42
app.weights.urgency=0.40
app.weights.waiting-days=0.20
app.weights.hla-match=0.20
app.weights.age-benefit=0.10
app.weights.transport-penalty=0.10

# Disable H2 Console for tests
spring.h2.console.enabled=false
