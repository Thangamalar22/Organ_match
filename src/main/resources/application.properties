# Synthetic Data Generator Configuration
server.port=8085
app.seed=42

# Score Weight Allocation
app.weights.urgency=0.40
app.weights.waiting-days=0.20
app.weights.hla-match=0.20
app.weights.age-benefit=0.10
app.weights.transport-penalty=0.10

# Database Configuration (H2 File Mode)
spring.datasource.url=jdbc:h2:mem:organmatch;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

# H2 Console Configuration (Development Only)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
